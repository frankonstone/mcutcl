[project]
root = "."
requirements = ["requirements.md"]
plans = ["plan/implementation-plan.md"]
sources = ["src/interpreter.cpp", "src/execution.cpp", "src/list.cpp", "src/profile.cpp", "src/main.cpp",
    "src/collections.cpp", "src/expression.cpp", "src/numeric.cpp", "src/control.cpp"]
build_files = ["CMakeLists.txt"]

[[artifacts]]
path = "build/host/artifacts/mcutest.json"
importer = "mcutest"

[validation]
fail_at_or_above = "error"
